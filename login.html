<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduSphere - Transforming Education</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="login.css">
  <link href="profile.html">
</head>
<body style="background-color: #0e0e3a;">
    <!-- Register/Login Section -->
    <section id="auth">
        <div class="container">
            <div class="row justify-content-center g-4">
                <!-- Register Section -->
                <div class="col-md-5" id="registerSection">
                    <div class="register-box">
                        <h2 class="text-center mb-4" style="color: #2c3e50; font-weight: 800;">Create Account</h2>
                        <p class="text-center text-muted mb-4">Join our learning community today</p>
                        <form id="registerForm" action="/register" method="POST">
                            <div class="form-floating mb-3">
                                <input type="text" name="fullName" class="form-control" id="regName" placeholder="Full Name" required>
                                <label for="regName">Full Name</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="email" name="email" class="form-control" id="regEmail" placeholder="Email" required>
                                <label for="regEmail">Email address</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" name="password" class="form-control" id="regPassword" placeholder="Password" required>
                                <label for="regPassword">Password</label>
                            </div>
                            <div class="form-floating mb-4">
                                <select class="form-select" name="role" id="regRole" required>
                                    <option value="" disabled selected>Choose your role</option>
                                    <option value="student">Student</option>
                                    <option value="teacher">Teacher</option>
                                    <option value="parent">Parent</option>
                                </select>
                                <label for="regRole">Select Role</label>
                            </div>
                            <!-- Additional Profile Fields -->
                            <div class="form-floating mb-3">
                                <input type="tel" name="phone" class="form-control" id="regPhone" placeholder="Phone Number">
                                <label for="regPhone">Phone Number</label>
                            </div>
                            <div class="form-floating mb-4">
                                <select class="form-select" name="passion" id="regPassion" required>
                                    <option value="" disabled selected>What are you passionate about?</option>
                                    <option value="science">Science & Technology</option>
                                    <option value="arts">Arts & Literature</option>
                                    <option value="math">Mathematics</option>
                                    <option value="languages">Languages</option>
                                    <option value="history">History & Social Studies</option>
                                    <option value="music">Music & Performing Arts</option>
                                    <option value="sports">Sports & Physical Education</option>
                                    <option value="business">Business & Economics</option>
                                </select>
                                <label for="regPassion">Field of Interest</label>
                            </div>
                            <button type="submit" class="btn-gradient-secondary" id="createAccountBtn">
                                Create Account
                            </button>
                            <div class="text-center mt-3">
                                <span class="text-muted">Already have an account?</span>
                                <button type="button" id="showLoginBtn" class="btn btn-link text-decoration-none" style="color: #e74c3c;">Sign in</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Login Section (Initially Hidden) -->
                <div class="col-md-5" id="loginSection" style="display: none;">
                    <div class="login-box">
                        <h2 class="text-center mb-4" style="color: #2c3e50; font-weight: 800;">Welcome Back!</h2>
                        <p class="text-center text-muted mb-4">Please login to your account</p>
                        <form id="loginForm" action="/login" method="POST">
                            <div class="form-floating mb-4">
                                <input type="email" name="email" class="form-control" id="loginEmail" placeholder="Email" required>
                                <label for="loginEmail">Email</label>
                            </div>
                            <div class="form-floating mb-4">
                                <input type="password" name="password" class="form-control" id="loginPassword" placeholder="Password" required>
                                <label for="loginPassword">Password</label>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="text-decoration-none" style="color: #3498db;">Forgot password?</a>
                            </div>
                            <button type="submit" class="btn-gradient-primary mb-3" id="loginBtn">
                               Login
                            </button>
                            <div class="text-center">
                                <span class="text-muted">Need to create an account?</span>
                                <button type="button" id="showRegisterBtn" class="btn btn-link text-decoration-none" style="color: #3498db;">Sign up</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('registerForm');
            const loginSection = document.getElementById('loginSection');
            const registerSection = document.getElementById('registerSection');
            const showLoginBtn = document.getElementById('showLoginBtn');
            const showRegisterBtn = document.getElementById('showRegisterBtn');
            const createAccountBtn = document.getElementById('createAccountBtn');
            const loginBtn = document.getElementById('loginBtn');
            const loginEmail = document.getElementById('loginEmail');
            const loginPassword = document.getElementById('loginPassword');

            // Handle create account button click
            createAccountBtn.addEventListener('click', function(e) {
                e.preventDefault();
                // registerForm.submit(); // Submit the form programmatically
                  // Get form data
                const formData = new FormData(registerForm);
                const userData = Object.fromEntries(formData);

                // Simulate successful registration
                sessionStorage.setItem('userProfile', JSON.stringify(userData));

                 alert('Account created successfully! Redirecting to profile page...');

        // // Redirect to profile page
        // window.location.href = 'courses.html';
                registerSection.style.display = 'none';
                loginSection.style.display = 'block';
            });

            // Handle registration form submission
            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const formData = new FormData(registerForm);
                const userData = Object.fromEntries(formData);
                
                try {
                    const response = await fetch('/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(userData)
                    });
                    
                    if (response.ok) {
                        // Store profile data in sessionStorage for profile page
                        sessionStorage.setItem('userProfile', JSON.stringify(userData));
                        alert('Account created successfully! Redirecting to profile page...');
                        
                        // Redirect to course page
                        window.location.href = 'courses.html';
                    }
                } catch (error) {
                    console.error('Registration error:', error);
                    alert('Error creating account. Please try again.');
                }
            });

            // Toggle between login and register sections
            showLoginBtn.addEventListener('click', function() {
                registerSection.style.display = 'none';
                loginSection.style.display = 'block';
            });

            showRegisterBtn.addEventListener('click', function() {
                loginSection.style.display = 'none';
                registerSection.style.display = 'block';
            });

            // Handle login form submission
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const formData = new FormData(this);
                const loginData = Object.fromEntries(formData);

                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(loginData)
                    });
                    
                    if (response.ok) {
                        // Get stored profile data
                        const userProfile = JSON.parse(sessionStorage.getItem('userProfile'));
                        
                        // Verify login credentials
                        if (userProfile && loginData.email === userProfile.email) {
                            // Redirect to profile page
                            window.location.href = "courses.html";
                        } else {
                            alert('Invalid credentials. Please try again.');
                        }
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    alert('Login failed. Please try again.');
                }
            });
        });

        loginBtn.addEventListener('click', function(e) {
            e.preventDefault();
            
            const loginEmailValue = loginEmail.value;
            const loginPasswordValue = loginPassword.value;
            const userProfile = JSON.parse(sessionStorage.getItem('userProfile'));

            if (userProfile && loginEmailValue === userProfile.email && loginPasswordValue === userProfile.password) {
                // Redirect to profile page
                window.location.href = 'courses.html';
            } else {
                alert('Invalid credentials. Please try again.');
            }
        });
    </script>
</body>
</html>
